# fqe runs its own test suite on every push and PR. A QA tool with no CI on
# itself is not credible. The job is named `test` so it can be required in
# branch protection. node --test needs no install (the suite is pure node:test).
#
# This runs `npm test`, NOT a hand-written node invocation, on purpose. When CI
# used its own command, the package.json script was free to rot unnoticed: it sat
# broken at `node --test test/` (MODULE_NOT_FOUND on Node 22) while CI stayed
# green on a different command. Running the documented command is what proves the
# documented command.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: unit + integration tests
        working-directory: cli
        run: npm test
