# fqe runs its own test suite on every push and PR. A QA tool with no CI on
# itself is not credible.
#
# This runs `npm test`, NOT a hand-written node invocation, on purpose. When CI
# used its own command, the package.json script was free to rot unnoticed: it sat
# broken at `node --test test/` (MODULE_NOT_FOUND on Node 22) while CI stayed
# green on a different command. Running the documented command is what proves the
# documented command.
#
# The matrix exists for the same reason. package.json declares engines
# node >= 20, and a floor nothing runs is a claim, not a fact. Windows is here
# because the repo asserts cross-platform behavior, and an untested self-claim is
# the exact defect v0.18.2 closes. (It earned its keep immediately: it showed the
# long-standing "1 Windows-symlink skip" line is true only on a Windows box
# without developer mode. GitHub's windows runners create symlinks fine and run
# all 773.)
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    name: suite (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5

        with:

          # No later step needs authenticated git, and the install job runs

          # repository code through npx. Do not leave a token in .git/config

          # while executing packed repo code.

          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: unit + integration tests
        working-directory: cli
        run: npm test

  # Separate job: a suite cannot count itself without spawning itself forever,
  # so the doc test-count claims are verified here, once, after the suite.
  doc-counts:
    runs-on: ubuntu-latest
    name: doc test-count claims
    steps:
      - uses: actions/checkout@v5

        with:

          # No later step needs authenticated git, and the install job runs

          # repository code through npx. Do not leave a token in .git/config

          # while executing packed repo code.

          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: every documented test count matches reality
        working-directory: cli
        run: node scripts/check_test_count.js

  # The documented install, actually executed.
  #
  # This is the job that would have caught the worst defect in the repo's history.
  # The README's headline command was `npx --yes github:booyajones/fqe#<tag>
  # cli/bin/fqe.js init`, and it had NEVER worked on any tagged version: there was
  # no package.json at the repo root, so npm cloned the repo and died with ENOENT
  # before running anything. Thirteen documented commands across nine files were in
  # that form, and the doc guards confirmed every one of them named the current
  # version while not one of them ran. Checking that a claim is CURRENT is not
  # checking that it is TRUE, and only running the command closes that gap.
  #
  # Installs the commit under review rather than a tag, so it validates the
  # packaging of THIS change instead of the last release.
  #
  # It installs from a `npm pack` TARBALL, not from the directory. Since npm 7 a
  # `file:` directory spec is LINKED rather than packed, which would skip the
  # pack-then-install path a real `github:` install takes. Today the two are
  # equivalent, but the root manifest gaining a `files` array that omitted `cli/`
  # would break the documented install while a linked install stayed green. The
  # whole thesis here is that only running the thing proves the thing, so run the
  # mechanism the adopter actually gets.
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: documented install (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v5

        with:

          # No later step needs authenticated git, and the install job runs

          # repository code through npx. Do not leave a token in .git/config

          # while executing packed repo code.

          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: pack this commit the way npm would
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Read the version via a RELATIVE path. Interpolating an absolute
          # Windows path into a JS string literal makes node treat the
          # backslashes as escapes: D:\a\fqe\fqe collapsed to D:aqeqe (\a bell,
          # \f formfeed) and the require failed. The install was fine, the check
          # was not. Caught by the windows leg on its first run.
          expected="$(node -p "require('./package.json').version")"
          echo "EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          # npm derives the tarball name from the manifest; find it rather than
          # guessing, so a name change here does not silently skip the test.
          tgz="$(ls "$RUNNER_TEMP"/*.tgz | head -1)"
          echo "TARBALL=$tgz" >> "$GITHUB_ENV"
          echo "packed: $tgz (expecting version $expected)"

      - name: npx-install the tarball and run the CLI
        shell: bash
        run: |
          set -euo pipefail
          out="$(npx --yes -p "$TARBALL" fqe version)"
          echo "fqe reported: $out"
          # Must be the version this commit declares, not merely any version: a
          # stale cached install would otherwise pass silently.
          case "$out" in
            *"$EXPECTED_VERSION"*) echo "matches the root manifest ($EXPECTED_VERSION)" ;;
            *) echo "::error::expected version $EXPECTED_VERSION, got: $out"; exit 1 ;;
          esac

      - name: the CLI can actually do work after install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe" && git init -q .
          npx --yes -p "$TARBALL" fqe init
          test -f .fqe.yml || { echo "::error::fqe init produced no .fqe.yml"; exit 1; }
          test -f .github/workflows/fqe-quality.yml || { echo "::error::fqe init produced no workflow"; exit 1; }
          npx --yes -p "$TARBALL" fqe validate
          echo "init + validate both work from a clean npx install"

  # This job exists to keep the branch-protection contract stable.
  #
  # `test` is the context required by branch protection on main. Turning the old
  # single job into a matrix renamed it to `suite (ubuntu-latest, node 20)` and
  # friends, which would have left the required `test` context permanently absent:
  # GitHub waits forever for a check that no longer reports, so nothing could
  # merge, and loosening protection to unblock it would have quietly removed the
  # gate. A fixed-name aggregator keeps the required context stable no matter how
  # the matrix is reshaped later.
  #
  # `if: always()` plus an explicit result check, NOT the default. Without it this
  # job would be SKIPPED when a matrix leg fails, and a skipped required check is
  # treated as success by branch protection: the gate would go green precisely
  # when the tests went red.
  test:
    needs: [suite, doc-counts, install]
    if: always()
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: every matrix leg, the doc-count check, and the install check passed
        run: |
          echo "suite:      ${{ needs.suite.result }}"
          echo "doc-counts: ${{ needs.doc-counts.result }}"
          echo "install:    ${{ needs.install.result }}"
          if [ "${{ needs.suite.result }}" != "success" ] \
            || [ "${{ needs.doc-counts.result }}" != "success" ] \
            || [ "${{ needs.install.result }}" != "success" ]; then
            echo "::error::a required check did not succeed"
            exit 1
          fi
