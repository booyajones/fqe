# Claude reviews every PR. This is the ADVISORY layer (comments, catches subtle
# bugs) that sits next to fqe's deterministic gate. It runs on Anthropic's
# official action, on our own ANTHROPIC_API_KEY, so there is no per-seat vendor.
# It does NOT block a merge (fqe + the `test` check do that); it comments.
#
# Note: secrets are not passed to PRs from forks, so this reviews internal-branch
# PRs only. That is the intended, safe behavior.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push makes the review of the old head moot: cancel it instead of paying
# for it to finish (7 of the 90 runs to date kept going after a newer push).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Runs so far take 5 min median, 10 max. Without this a stuck run gets GitHub's 6 h default.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a PR for a B2B payments company. Be direct and
            specific. Prioritize, in this order:

            1. **Money/state correctness** — float math on currency, missing
               idempotency, double-apply, rounding that loses cents, mutated
               inputs, unhandled partner-API responses. These are the
               bet-the-company bugs.
            2. **Security** — input validation, injection, secrets in code,
               auth/authz, swallowed errors that hide failures.
            3. **Correctness + edge cases** — null/undefined, loose equality,
               error handling, off-by-one.
            4. **Tests** — does the change have tests that would actually CATCH
               a regression (assertions, not just coverage)?

            Use inline comments for specific issues. Use one top-level comment to
            summarize and to call out anything that should block (a human or the
            fqe gate decides; you advise). If the code is clean, say so plainly.

          # Recent reviews use 4 to 16 turns; 30 caps a looping run at about twice that.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
