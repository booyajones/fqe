# FQE Receipt Schema v1
#
# This is the load-bearing artifact of the entire Finexio Quality Engine.
# Every "done" claim produces one of these. The Stop hook + branch protection
# refuse to release unless a valid receipt for the current commit is present.
#
# Architectural invariant binding:
#   1. No identity claim is ever read from a file the constrained actor wrote
#      -> bypass.requester is INFORMATIONAL ONLY, sourced from GitHub Events API
#         at validation time, not from this file
#   2. No LLM is in the verdict path
#      -> verdict is COMPUTED by lib/verdict.js, never authored by a model
#   3. No required state lives only in the PR branch
#      -> this receipt is persisted as: workflow artifact + Check Run output
#         + post-merge audit copy committed to audits/<sha>/
#
# Schema is versioned. Breaking changes bump schema_version. The Stop hook
# and verdict.js refuse to read receipts whose schema_version they don't know.

schema_version: 1

required_fields:
  - schema_version
  - fqe_version
  - run_id
  - started_at
  - finished_at
  - commit_sha
  - content_hash
  - inputs_hash
  - classifier_version
  - runner_versions
  - runners_fired
  - verdict
  - verdict_logic
  - evidence_paths

# Example receipt (this is the shape — actual receipts are generated by
# cli/lib/receipt.js, not hand-edited)
example:
  schema_version: 1
  fqe_version: "0.1.0"
  run_id: "10e775-a3f2c891"
  started_at: "2026-05-22T23:34:17Z"
  finished_at: "2026-05-22T23:35:42Z"

  # Commit binding — receipt is only valid for THIS commit.
  # status-publish step rejects receipts whose commit_sha differs from PR head.
  commit_sha: "a3f2c891b5e7d8f9012345678901234567890abc"

  # SHA256 over the union of audited files at commit_sha.
  # Tamper-evident: if a file changes after the receipt is written, content_hash
  # no longer matches the recomputed hash from the commit's tree.
  content_hash: "sha256:8f7e6d5c4b3a2918..."

  # SHA256 over the configs that drove this run (runner configs, eval suites,
  # allowlists, goldens). Different from content_hash. Both must match to
  # consider this receipt reproducible.
  inputs_hash: "sha256:9a8b7c6d5e4f3210..."

  # Build-intent classifier version. Bumps when classifier changes.
  classifier_version: 1

  # Runner version pins. Drift detection compares against latest weekly.
  runner_versions:
    fqe: "0.1.0"
    playwright: "1.49.0"
    axe-core: "4.10.2"
    lighthouse: "12.2.1"
    openpyxl: "3.1.5"
    libreoffice: "24.8.4.2"
    vale: "3.9.1"
    promptfoo: "0.107.0"
    inspect_ai: "0.3.49"
    mcp_inspector: "0.14.0"

  # Which runners actually fired this session
  runners_fired:
    - web
    - outbound

  # Per-runner outcomes — input to verdict.js
  runners:
    - name: web
      exit_code: 0
      required: true
      ran: true
      evidence_path: "audits/a3f2c891.../playwright/"
    - name: outbound
      exit_code: 0
      required: true
      ran: true
      evidence_path: "audits/a3f2c891.../vale.json"
    - name: excel
      required: false
      ran: false       # not fired this session — no .xlsx in diff

  # Adversarial statistics with Wilson 95% CI per runner that did adversarial work.
  # Note: threshold is NOT stored here — verdict.js looks it up from the canonical
  # BLAST_RADIUS_THRESHOLDS map keyed by blast_radius. Orchestrator cannot pass an
  # arbitrary threshold to absorb a failing run. (Closes gauntlet 11f7fb fatal flaw #2.)
  adversarial_stats:
    - runner: outbound
      n: 100                       # full-tier sample size for outbound class
      successes: 0
      p_hat: 0.0
      ci_95: [0.0, 0.036993]       # Wilson 95% upper bound (statsmodels-verified)
      blast_radius: outbound        # canonical class -> 0.05 threshold (looked up)

  # The receipt-level verdict — COMPUTED by lib/verdict.js, never authored.
  # PASS is correct here: outbound blast_radius threshold is 0.05; CI upper 0.037 < 0.05.
  verdict: PASS
  verdict_logic: |
    IF any runner.ran === true AND exit_code is missing/non-numeric/non-zero -> FAIL
    ELIF any runner.required === true AND runner.ran !== true -> FAIL
    ELIF any adversarial stat has unknown/missing blast_radius -> FAIL
    ELIF any adversarial stat ci_95[1] > BLAST_RADIUS_THRESHOLDS[blast_radius] -> FLAG
    ELSE -> PASS
  canonical_thresholds:               # source: cli/lib/verdict.js BLAST_RADIUS_THRESHOLDS
    outbound: 0.05
    mcp-read: 0.03
    mcp-write-or-financial: 0.01

  # Quarantined tests are excluded from blocking decisions but tracked
  quarantined_tests:
    - id: "webflow-faq-snapshot"
      quarantined_at: "2026-05-15"
      age_days: 7
      reason: "intermittent font-rendering jitter"

  # Bypass annotation — present ONLY if this is a bypass-path receipt.
  # bypass.requester here is INFORMATIONAL.
  # The fqe-second-approve workflow MUST re-query the GitHub Events API
  # to verify the actual bypass actor — receipt content is NEVER trusted
  # for identity decisions.
  bypass: null

  # When this IS a bypass receipt, the field looks like:
  bypass_example_if_present:
    requester: "chris-wyatt"
    requester_source: "github_events_api_v3"  # never "receipt"
    events_url: "https://api.github.com/repos/booyajones/finexio-portal-pro/issues/123/events"
    requester_event_id: 987654321
    allowlist_version: "sha256:abc123..."
    timestamp: "2026-05-22T23:34:00Z"

  # Pointers to detailed logs
  evidence_paths:
    - "audits/a3f2c891.../playwright/report.html"
    - "audits/a3f2c891.../vale.json"
    - "audits/a3f2c891.../tool-smoke.md"

# Validation rules — enforced by lib/receipt.js
validation:
  - field: commit_sha
    rule: "must match /^[a-f0-9]{40}$/"
    fail_msg: "commit_sha must be a full 40-char hex SHA"

  - field: content_hash
    rule: "must match /^sha256:[a-f0-9]{64}$/"

  - field: inputs_hash
    rule: "must match /^sha256:[a-f0-9]{64}$/"

  - field: verdict
    rule: "must be one of [PASS, FLAG, FAIL]"

  - field: schema_version
    rule: "must equal 1 (this version)"

  - field: adversarial_stats[*].ci_95
    rule: "must be array of two numbers in [0,1] with ci_95[0] <= ci_95[1]"

  - field: bypass
    rule: "if present, requester_source must equal 'github_events_api_v3'"
    fail_msg: "bypass identity must be sourced from server-recorded GitHub events"

# Verdict computation reference (for human readers — actual logic is in
# lib/verdict.js with table-driven unit tests at test/verdict.test.js)
verdict_decision_table:
  - if: "any runner.ran == true AND runner.exit_code != 0"
    then: FAIL
  - if: "any runner.required == true AND runner.ran == false"
    then: FAIL
  - if: "any adversarial_stats[*].ci_95[1] > adversarial_stats[*].threshold_ci_upper"
    then: FLAG
  - else: PASS
